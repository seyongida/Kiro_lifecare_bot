[project]
name = "lifecare-bot"
version = "1.4.0"
description = "LG U+ Life Care 상품 크롤러 + 텔레그램 알림"
requires-python = ">=3.9"
dependencies = [
    "playwright==1.49.1",
    "python-dotenv==1.0.1",
    "python-telegram-bot==21.9",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
