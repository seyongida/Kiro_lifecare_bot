name: 저장소 활성 상태 유지

# 공개 저장소는 60일간 커밋이 없으면 schedule 워크플로가 자동 중단된다.
# 매월 1일 빈 커밋을 push해 크롤링 스케줄이 멈추지 않게 한다.
# (크롤링 워크플로와 분리 — 크롤링 실패와 무관하게 실행되도록)
on:
  schedule:
    - cron: '23 4 1 * *'   # 매월 1일 KST 13:23
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 빈 커밋 push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive [skip ci]"
          git push
